services:
  db:
    image: postgres:16-alpine
    container_name: assistant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant_password}
      POSTGRES_DB: ${POSTGRES_DB:-assistant_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: assistant-backend
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-assistant_db}
      - POSTGRES_USER=${POSTGRES_USER:-assistant_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant_password}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - TZ=Europe/Berlin
      - BRIDGE_URL=http://whatsapp-bridge:3001
    volumes:
      - ./.env:/app/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    container_name: assistant-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
      network: host
    container_name: assistant-whatsapp-bridge
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - BACKEND_URL=http://backend:8080
      - SESSION_DIR=/app/sessions
      - PORT=3001
    volumes:
      - whatsapp_sessions:/app/sessions
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  whatsapp_sessions:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
